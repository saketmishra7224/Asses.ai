version: '3.8'

services:
  # Redis Database
  redis:
    image: redis/redis-stack:latest
    container_name: asses-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # Redis Insight UI
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asses-network

  # FastAPI Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: asses-server
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
    networks:
      - asses-network

  # React Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: asses-client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - asses-network

networks:
  asses-network:
    driver: bridge

volumes:
  redis_data:
